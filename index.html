  <body>
    <script>
      try {
        // Clear cached config and old guest data if it holds previous wedding data
        var cfg = localStorage.getItem('aura_vows_config_v7') || localStorage.getItem('aura_vows_config_v8');
        if (cfg && (cfg.indexOf('Blessing') !== -1 || cfg.indexOf('Ruvarashe') !== -1)) {
          localStorage.removeItem('aura_vows_config_v7');
          localStorage.removeItem('aura_vows_guests_v7');
          localStorage.removeItem('aura_vows_activity_v7');
          localStorage.removeItem('aura_vows_config_v8');
          localStorage.removeItem('aura_vows_guests_v8');
          localStorage.removeItem('aura_vows_activity_v8');
        }
        localStorage.removeItem('aura_vows_guests_v5');
        localStorage.removeItem('aura_vows_activity_v5');
        localStorage.removeItem('aura_vows_guests_v6');
        localStorage.removeItem('aura_vows_activity_v6');
        localStorage.removeItem('aura_vows_guests_v4');
        localStorage.removeItem('aura_vows_guests_v3');
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
